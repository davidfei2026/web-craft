<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WebCraft V1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game"></div>

    <div id="crosshair">+</div>

    <div id="instructions">
        <h1>WebCraft</h1>

        <p>Click to play</p>

        <div>
            <b>W A S D</b> — Move
        </div>

        <div>
            <b>Mouse</b> — Look
        </div>

        <div>
            <b>Space</b> — Jump
        </div>
    </div>

    <div id="hotbar">
        <div class="slot selected">1</div>
        <div class="slot">2</div>
        <div class="slot">3</div>
        <div class="slot">4</div>
        <div class="slot">5</div>
        <div class="slot">6</div>
        <div class="slot">7</div>
        <div class="slot">8</div>
        <div class="slot">9</div>
    </div>

    <script type="module" src="js/main.js"></script>

</body>
</html>
